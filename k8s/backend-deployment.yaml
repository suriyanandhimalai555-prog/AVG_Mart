apiVersion: apps/v1
kind: Deployment

metadata:
  name: avgmart-backend
  namespace: avgmart

spec:
  replicas: 1

  revisionHistoryLimit: 10

  progressDeadlineSeconds: 600

  selector:
    matchLabels:
      app: avgmart-backend

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  template:
    metadata:
      labels:
        app: avgmart-backend

    spec:
      containers:
        - name: backend

          image: ghcr.io/suriyanandhimalai555-prog/avgmart-backend:latest

          imagePullPolicy: Always

          ports:
            - containerPort: 5000
              protocol: TCP

          envFrom:
            - secretRef:
                name: avgmart-secret

          # Application health check
          # Kubernetes checks the actual /health endpoint
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          # Application liveness check
          # Kubernetes restarts the container if the application
          # becomes unhealthy
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            successThreshold: 1
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi

            limits:
              cpu: 500m
              memory: 512Mi

          terminationMessagePath: /dev/termination-log

          terminationMessagePolicy: File

      restartPolicy: Always

      terminationGracePeriodSeconds: 30

      dnsPolicy: ClusterFirst

      schedulerName: default-scheduler
