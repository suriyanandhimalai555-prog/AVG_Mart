apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: avgmart-ingress
  namespace: avgmart
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

spec:
  ingressClassName: nginx

  tls:
    - hosts:
        - avgmart.com
        - www.avgmart.com
        - api.avgmart.com
      secretName: avgmart-tls

  rules:
    - host: avgmart.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: avgmart-backend
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgmart-frontend
                port:
                  number: 80

    - host: www.avgmart.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: avgmart-backend
                port:
                  number: 5000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgmart-frontend
                port:
                  number: 80

    - host: api.avgmart.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: avgmart-backend
                port:
                  number: 5000
