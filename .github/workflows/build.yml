name: Build and Push Docker Images

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  OWNER: suriyanandhimalai555-prog

jobs:

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64

          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
          tags: |
            ghcr.io/${{ env.OWNER }}/avgmart-backend:${{ github.sha }}-${{ matrix.arch }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          sbom: false
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}
          build-args: |
            VITE_APP_BASE_URL=https://avgmart.com
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ env.OWNER }}/avgmart-frontend:${{ github.sha }}-${{ matrix.arch }}


  manifest:
    name: Create Multi-Architecture Images
    runs-on: ubuntu-latest
    needs: build

    steps:

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Backend Multi-Architecture Image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER }}/avgmart-backend:latest \
            -t ghcr.io/${{ env.OWNER }}/avgmart-backend:${{ github.sha }} \
            ghcr.io/${{ env.OWNER }}/avgmart-backend:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.OWNER }}/avgmart-backend:${{ github.sha }}-arm64

      - name: Create Frontend Multi-Architecture Image
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ env.OWNER }}/avgmart-frontend:latest \
            -t ghcr.io/${{ env.OWNER }}/avgmart-frontend:${{ github.sha }} \
            ghcr.io/${{ env.OWNER }}/avgmart-frontend:${{ github.sha }}-amd64 \
            ghcr.io/${{ env.OWNER }}/avgmart-frontend:${{ github.sha }}-arm64
