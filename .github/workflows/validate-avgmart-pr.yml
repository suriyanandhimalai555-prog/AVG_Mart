name: Validate AVG Mart PR

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate AVG Mart PR
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend ESLint
        working-directory: client
        run: npm run lint

      - name: Remove Installed Dependencies Before Docker Builds
        run: |
          rm -rf server/node_modules client/node_modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (AMD64 and ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

      - name: Build Frontend Image (AMD64 and ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_BASE_URL=https://api.avgmart.com
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}
