name: AVG Mart - PR Validation and Auto Merge

on:
  workflow_dispatch:

  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: avgmart-pr-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate AVG Mart PR
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout PR Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Backend Dependencies
        working-directory: server
        run: npm ci

      - name: Install Frontend Dependencies
        working-directory: client
        run: npm ci

      - name: Run Frontend ESLint (Advisory)
        working-directory: client
        continue-on-error: true
        run: npm run lint

      - name: Remove Installed Dependencies Before Docker Builds
        run: |
          rm -rf server/node_modules client/node_modules

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image (AMD64 and ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false

      - name: Build Frontend Image (AMD64 and ARM64)
        uses: docker/build-push-action@v7
        with:
          context: ./client
          file: ./client/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: false
          provenance: false
          sbom: false
          build-args: |
            VITE_APP_BASE_URL=https://api.avgmart.com
            VITE_GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}

  notify-failure:
    name: Send PR Validation Failure Email
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - validate
    if: >-
      ${{
        always() &&
        needs.validate.result == 'failure' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      }}

    steps:
      - name: Send Microsoft Graph Failure Notification
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}
          MS_SENDER_EMAIL: ${{ vars.MS_SENDER_EMAIL }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_CC: ${{ vars.MAIL_CC }}

          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          TARGET_BRANCH: ${{ github.base_ref }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}

        run: |
          set -euo pipefail

          echo "Preparing AVG Mart PR validation failure notification..."

          : "${MS_TENANT_ID:?Missing MS_TENANT_ID GitHub secret}"
          : "${MS_CLIENT_ID:?Missing MS_CLIENT_ID GitHub secret}"
          : "${MS_CLIENT_SECRET:?Missing MS_CLIENT_SECRET GitHub secret}"
          : "${MS_SENDER_EMAIL:?Missing MS_SENDER_EMAIL repository variable}"
          : "${MAIL_TO:?Missing MAIL_TO repository variable}"

          SUBJECT="FAILED: AVG Mart PR Validation - PR #${PR_NUMBER}"

          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${MS_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          unset TOKEN_RESPONSE MS_CLIENT_SECRET

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: Microsoft Graph access token was not returned."
            exit 1
          fi

          MAIL_PAYLOAD=$(jq -n \
            --arg subject "$SUBJECT" \
            --arg repository "$REPOSITORY" \
            --arg pr "$PR_NUMBER" \
            --arg source "$SOURCE_BRANCH" \
            --arg target "$TARGET_BRANCH" \
            --arg commit "$COMMIT_SHA" \
            --arg workflow_url "$WORKFLOW_URL" \
            --arg to "$MAIL_TO" \
            --arg cc "${MAIL_CC:-}" \
            '{
              message: {
                subject: $subject,
                body: {
                  contentType: "HTML",
                  content: (
                    "<h2>AVG Mart PR Validation FAILED</h2>" +
                    "<p>PR validation failed. Investigate before merging.</p>" +
                    "<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">" +
                    "<tr><td><b>Repository</b></td><td>" + ($repository | @html) + "</td></tr>" +
                    "<tr><td><b>Pull request</b></td><td>#" + ($pr | @html) + "</td></tr>" +
                    "<tr><td><b>Source branch</b></td><td>" + ($source | @html) + "</td></tr>" +
                    "<tr><td><b>Target branch</b></td><td>" + ($target | @html) + "</td></tr>" +
                    "<tr><td><b>Commit</b></td><td>" + ($commit | @html) + "</td></tr>" +
                    "</table>" +
                    "<p><a href=\"" + ($workflow_url | @html) + "\">View failed GitHub Actions run</a></p>"
                  )
                },
                toRecipients: [
                  {emailAddress: {address: $to}}
                ],
                ccRecipients: (
                  if ($cc | length) > 0
                  then [{emailAddress: {address: $cc}}]
                  else []
                  end
                )
              },
              saveToSentItems: true
            }')

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/avgmart-pr-validation-mail-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://graph.microsoft.com/v1.0/users/${MS_SENDER_EMAIL}/sendMail" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$MAIL_PAYLOAD")

          unset ACCESS_TOKEN MAIL_PAYLOAD

          if [[ "$HTTP_STATUS" != "202" ]]; then
            echo "ERROR: Microsoft Graph email request failed."
            echo "HTTP status: $HTTP_STATUS"
            cat /tmp/avgmart-pr-validation-mail-response.txt
            exit 1
          fi

          echo "Microsoft Graph accepted the failure notification."

  auto-merge:
    name: Automatically Merge AVG Mart PR
    runs-on: ubuntu-latest
    needs:
      - validate

    if: >-
      ${{
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.base.ref == 'main' &&
        !github.event.pull_request.draft
      }}

    steps:
      - name: Enable automatic squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr merge "$PR_URL" --auto --squash
