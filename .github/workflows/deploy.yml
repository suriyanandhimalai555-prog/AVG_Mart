name: Deploy AVG Mart Kubernetes

on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    outputs:
      ssh_stdout: ${{ steps.remote_deploy.outputs.stdout }}

    steps:
      - name: Deploy AVG Mart Kubernetes
        id: remote_deploy
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: IMAGE_TAG
          capture_stdout: true

          script: |
            set -e

            cd /home/ubuntu/Applications/AVG_Mart

            echo "Deploying commit: ${IMAGE_TAG}"

            git fetch origin main

            LATEST_MAIN=$(git rev-parse FETCH_HEAD)

            echo "Build commit: ${IMAGE_TAG}"
            echo "Latest main:  ${LATEST_MAIN}"

            if [ "${IMAGE_TAG}" != "${LATEST_MAIN}" ]; then
              echo "Skipping deployment: a newer commit exists on main."
              exit 0
            fi

            git checkout -B main origin/main
            git reset --hard origin/main

            echo "Current Git commit:"
            git rev-parse HEAD

            echo "Expected image tag:"
            echo "${IMAGE_TAG}"

            chmod +x scripts/k8s-deploy-frontend.sh

            IMAGE_TAG="${IMAGE_TAG}" ./scripts/k8s-deploy-frontend.sh

            echo "Checking deployments..."

            kubectl get deployments -n avgmart

            echo "Checking pods..."

            kubectl get pods -n avgmart

            echo "Checking services..."

            kubectl get svc -n avgmart

            echo "Checking ingress..."

            kubectl get ingress -n avgmart

            echo "Checking backend image..."

            kubectl get deployment avgmart-backend \
              -n avgmart \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo

            echo "Checking frontend image..."

            kubectl get deployment avgmart-frontend \
              -n avgmart \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo

            echo "Waiting for backend rollout..."

            kubectl rollout status deployment/avgmart-backend \
              -n avgmart \
              --timeout=180s

            echo "Waiting for frontend rollout..."

            kubectl rollout status deployment/avgmart-frontend \
              -n avgmart \
              --timeout=180s

            echo "Checking backend health..."

            BACKEND_POD=$(kubectl get pods \
              -n avgmart \
              -l app=avgmart-backend \
              -o jsonpath='{.items[0].metadata.name}')

            kubectl exec -n avgmart "${BACKEND_POD}" -- \
              wget -qO- http://127.0.0.1:5000/health

            echo

            echo "AVG Mart deployment completed successfully."

  notify:
    name: Send Microsoft Graph Email Notification
    runs-on: ubuntu-latest
    needs:
      - deploy
    if: always()

    steps:
      - name: Send deployment notification
        shell: bash
        env:
          MS_TENANT_ID: ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_CLIENT_SECRET: ${{ secrets.MS_CLIENT_SECRET }}

          MS_SENDER_EMAIL: ${{ vars.MS_SENDER_EMAIL }}
          MAIL_TO: ${{ vars.MAIL_TO }}
          MAIL_CC: ${{ vars.MAIL_CC }}

          BUILD_RESULT: ${{ github.event.workflow_run.conclusion }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          SSH_STDOUT: ${{ needs.deploy.outputs.ssh_stdout }}

          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN_URL: ${{ github.event.workflow_run.html_url }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPOSITORY: ${{ github.repository }}

        run: |
          set -euo pipefail

          echo "Checking build and deployment results..."

          if [[ "$BUILD_RESULT" != "success" || "$DEPLOY_RESULT" == "failure" ]]; then
            STATUS="FAILED"
            SUBJECT="AVG Mart Kubernetes Deployment Failed"
          elif [[ "$DEPLOY_RESULT" == "skipped" ]]; then
            STATUS="SKIPPED"
            SUBJECT="AVG Mart Kubernetes Deployment Skipped"
          elif [[ "$SSH_STDOUT" == *"Skipping deployment: a newer commit exists on main."* ]]; then
            STATUS="SKIPPED"
            SUBJECT="AVG Mart Kubernetes Deployment Skipped - Newer Commit Exists"
          elif [[ "$DEPLOY_RESULT" == "success" ]]; then
            STATUS="SUCCESSFUL"
            SUBJECT="AVG Mart Kubernetes Deployment Successful"
          else
            STATUS="FAILED"
            SUBJECT="AVG Mart Kubernetes Deployment Failed"
          fi

          echo "Build result: $BUILD_RESULT"
          echo "Deployment result: $DEPLOY_RESULT"
          echo "Final status: $STATUS"

          echo "Requesting Microsoft Graph access token..."

          TOKEN_RESPONSE=$(curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://login.microsoftonline.com/${MS_TENANT_ID}/oauth2/v2.0/token" \
            --header "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=${MS_CLIENT_ID}" \
            --data-urlencode "client_secret=${MS_CLIENT_SECRET}" \
            --data-urlencode "scope=https://graph.microsoft.com/.default" \
            --data-urlencode "grant_type=client_credentials")

          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')

          if [[ -z "$ACCESS_TOKEN" ]]; then
            echo "ERROR: Microsoft Graph access token was not returned."
            exit 1
          fi

          echo "Access token obtained successfully."

          case "$STATUS" in
            SUCCESSFUL)
              DETAILS="Docker image build, Kubernetes deployment, rollout checks and backend health check completed successfully."
              ;;
            SKIPPED)
              DETAILS="This deployment was skipped because a newer commit exists or the deployment job did not run. Check the workflow logs before considering the latest code deployed."
              ;;
            *)
              DETAILS="The Docker build or Kubernetes deployment failed. Review the GitHub Actions logs to identify the failure."
              ;;
          esac

          MAIL_PAYLOAD=$(jq -n \
            --arg subject "$SUBJECT" \
            --arg status "$STATUS" \
            --arg details "$DETAILS" \
            --arg repository "$REPOSITORY" \
            --arg image_tag "$IMAGE_TAG" \
            --arg build_result "$BUILD_RESULT" \
            --arg deploy_result "$DEPLOY_RESULT" \
            --arg build_url "$BUILD_RUN_URL" \
            --arg deploy_url "$DEPLOY_RUN_URL" \
            --arg to "$MAIL_TO" \
            --arg cc "$MAIL_CC" \
            '{
              message: {
                subject: $subject,
                body: {
                  contentType: "HTML",
                  content: (
                    "<h2>AVG Mart Kubernetes Deployment " + $status + "</h2>" +
                    "<p>" + $details + "</p>" +
                    "<table border=\"1\" cellpadding=\"6\" cellspacing=\"0\">" +
                    "<tr><td><b>Repository</b></td><td>" + $repository + "</td></tr>" +
                    "<tr><td><b>Image Tag / Commit</b></td><td>" + $image_tag + "</td></tr>" +
                    "<tr><td><b>Docker Build Result</b></td><td>" + $build_result + "</td></tr>" +
                    "<tr><td><b>Deployment Job Result</b></td><td>" + $deploy_result + "</td></tr>" +
                    "</table>" +
                    "<p><a href=\"" + $build_url + "\">View Docker Build Run</a></p>" +
                    "<p><a href=\"" + $deploy_url + "\">View Deployment Workflow Run</a></p>"
                  )
                },
                toRecipients: [
                  {emailAddress: {address: $to}}
                ],
                ccRecipients: [
                  {emailAddress: {address: $cc}}
                ]
              },
              saveToSentItems: true
            }')

          echo "Sending email through Microsoft Graph..."

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/graph-mail-response.txt \
            --write-out "%{http_code}" \
            --request POST \
            --url "https://graph.microsoft.com/v1.0/users/${MS_SENDER_EMAIL}/sendMail" \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            --header "Content-Type: application/json" \
            --data "$MAIL_PAYLOAD")

          unset ACCESS_TOKEN TOKEN_RESPONSE MS_CLIENT_SECRET

          if [[ "$HTTP_STATUS" != "202" ]]; then
            echo "ERROR: Microsoft Graph email request failed."
            echo "HTTP status: $HTTP_STATUS"
            cat /tmp/graph-mail-response.txt
            exit 1
          fi

          echo "SUCCESS: Microsoft Graph accepted the $STATUS notification."
          echo "Sender: $MS_SENDER_EMAIL"
          echo "To: $MAIL_TO"
          echo "CC: $MAIL_CC"
