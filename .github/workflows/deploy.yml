name: Deploy AVG Mart Kubernetes

on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy AVG Mart Kubernetes
        uses: appleboy/ssh-action@v1.2.2
        env:
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: IMAGE_TAG

          script: |
            set -e

            cd /home/ubuntu/Applications/AVG_Mart

            echo "Deploying commit: ${IMAGE_TAG}"

            git fetch origin
            git reset --hard origin/main

            echo "Current Git commit:"
            git rev-parse HEAD

            echo "Expected image tag:"
            echo "${IMAGE_TAG}"

            chmod +x scripts/k8s-deploy.sh

            IMAGE_TAG="${IMAGE_TAG}" ./scripts/k8s-deploy.sh

            echo "Checking deployments..."

            kubectl get deployments -n avgmart

            echo "Checking pods..."

            kubectl get pods -n avgmart

            echo "Checking services..."

            kubectl get svc -n avgmart

            echo "Checking ingress..."

            kubectl get ingress -n avgmart

            echo "Checking backend image..."

            kubectl get deployment avgmart-backend \
              -n avgmart \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo

            echo "Checking frontend image..."

            kubectl get deployment avgmart-frontend \
              -n avgmart \
              -o jsonpath='{.spec.template.spec.containers[0].image}'

            echo

            echo "Waiting for backend rollout..."

            kubectl rollout status deployment/avgmart-backend \
              -n avgmart \
              --timeout=180s

            echo "Waiting for frontend rollout..."

            kubectl rollout status deployment/avgmart-frontend \
              -n avgmart \
              --timeout=180s

            echo "Checking backend health..."

            BACKEND_POD=$(kubectl get pods \
              -n avgmart \
              -l app=avgmart-backend \
              -o jsonpath='{.items[0].metadata.name}')

            kubectl exec -n avgmart "${BACKEND_POD}" -- \
              wget -qO- http://127.0.0.1:5000/health

            echo

            echo "AVG Mart deployment completed successfully."

      - name: Send Success Email
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "AVG Mart Kubernetes Deployment Successful"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: AVG Mart CI/CD <${{ secrets.SMTP_USERNAME }}>

          html_body: |
            <h2>AVG Mart Kubernetes Deployment Successful</h2>

            <ul>
              <li>Docker images built successfully</li>
              <li>Multi-platform images pushed to GHCR</li>
              <li>Kubernetes manifests applied</li>
              <li>Backend rollout completed</li>
              <li>Frontend rollout completed</li>
              <li>Backend health check passed</li>
              <li>Deployment completed successfully</li>
            </ul>

            <p>
              <strong>Image Tag:</strong>
              ${{ github.event.workflow_run.head_sha }}
            </p>

      - name: Send Failure Email
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}

          subject: "AVG Mart Kubernetes Deployment Failed"

          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            devops@avgprimetech.com

          from: AVG Mart CI/CD <${{ secrets.SMTP_USERNAME }}>

          html_body: |
            <h2>AVG Mart Kubernetes Deployment Failed</h2>

            <ul>
              <li>Kubernetes deployment failed</li>
              <li>Rollout verification failed</li>
              <li>Check GitHub Actions logs</li>
            </ul>

            <p>
              <strong>Image Tag:</strong>
              ${{ github.event.workflow_run.head_sha }}
            </p>
