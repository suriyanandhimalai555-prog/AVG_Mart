name: Deploy AVG Mart Kubernetes


on:
  workflow_run:
    workflows:
      - Build and Push Docker Images
    types:
      - completed
    branches:
      - main


jobs:

  deploy:

    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    name: Deploy to Kubernetes

    runs-on: ubuntu-latest


    steps:


      - name: Checkout Repository
        uses: actions/checkout@v4



      - name: Deploy AVG Mart Kubernetes

        uses: appleboy/ssh-action@v1.2.2

        with:

          host: ${{ secrets.VPS_HOST }}

          username: ${{ secrets.VPS_USER }}

          key: ${{ secrets.VPS_KEY }}

          port: 22

          timeout: 60s

          command_timeout: 20m


          script: |

            set -e


            echo "================================"

            echo "AVG MART KUBERNETES DEPLOYMENT"

            echo "================================"



            cd /root/otp/apps/AVG_Mart



            echo "Updating source code"


            git fetch origin

            git reset --hard origin/main



            echo "Starting Kubernetes deployment"



            chmod +x scripts/k8s-deploy.sh



            ./scripts/k8s-deploy.sh



            echo "Checking application status"



            kubectl get pods -n avgmart



            echo "Checking ingress"



            kubectl get ingress -n avgmart



            echo "Deployment completed successfully"




      - name: Send Success Email

        if: success()

        uses: dawidd6/action-send-mail@v3


        with:

          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}


          subject: "✅ AVG Mart Kubernetes Deployment Successful"


          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com


          from: Deepak CI/CD <deepakavgprimetech@gmail.com>


          html_body: |

            <h2>
            AVG Mart Kubernetes Deployment Successful
            </h2>


            <ul>

            <li>✅ Docker images built</li>

            <li>✅ Images pushed to GHCR</li>

            <li>✅ Kubernetes manifests applied</li>

            <li>✅ Rolling update completed</li>

            <li>✅ Health checks passed</li>

            <li>✅ Deployment successful</li>

            </ul>




      - name: Send Failure Email

        if: failure()

        uses: dawidd6/action-send-mail@v3


        with:

          server_address: ${{ secrets.SMTP_SERVER }}

          server_port: ${{ secrets.SMTP_PORT }}

          secure: true

          username: ${{ secrets.SMTP_USERNAME }}

          password: ${{ secrets.SMTP_PASSWORD }}


          subject: "❌ AVG Mart Kubernetes Deployment Failed"


          to: |
            Sanjayvanan03@gmail.com,
            muthukdm45@gmail.com,
            deepakavgprimetech@gmail.com


          from: Deepak CI/CD <deepakavgprimetech@gmail.com>


          html_body: |

            <h2>
            AVG Mart Kubernetes Deployment Failed
            </h2>


            <ul>

            <li>❌ Kubernetes rollout failed</li>

            <li>❌ Automatic rollback executed</li>

            <li>📄 Check GitHub Actions logs</li>

            </ul>
